name: Build and Publish Luna Image

on:
  push:
    branches: ['**']
    paths-ignore:
      - 'deploy/helm/**'
  pull_request:
    branches: ['**']
    paths-ignore:
      - 'deploy/helm/**'

concurrency:
  group: luna-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: us-east-1
  MANAGEMENT_INFRASTRUCTURE_ACCOUNT_ID: ${{ secrets.MANAGEMENT_INFRASTRUCTURE_ACCOUNT_ID }}
  AWS_ROLE_MANAGEMENT_INFRASTRUCTURE: ${{ secrets.AWS_ROLE_MANAGEMENT_INFRASTRUCTURE }}
  PRODUCTION_ACCOUNT_ID: ${{ secrets.PRODUCTION_ACCOUNT_ID }}

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Build application
        run: bun run build

      - name: Audit high and critical dependency vulnerabilities
        run: bun audit --audit-level=high

  build-push:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    name: Build and Push Luna Image to Management ECR
    runs-on: ubuntu-latest
    needs: build-and-test
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_MANAGEMENT_INFRASTRUCTURE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push
        run: |
          image_uri="${MANAGEMENT_INFRASTRUCTURE_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/luna"
          image_tag="${GITHUB_SHA::7}"

          aws ecr describe-repositories --repository-names luna >/dev/null 2>&1 || \
            aws ecr create-repository \
              --repository-name luna \
              --image-scanning-configuration scanOnPush=true >/dev/null

          policy_json=$(jq -n \
            --arg production "arn:aws:iam::${PRODUCTION_ACCOUNT_ID}:root" \
            '{
              Version: "2008-10-17",
              Statement: [{
                Sid: "AllowCrossAccountPullProduction",
                Effect: "Allow",
                Principal: {AWS: $production},
                Action: [
                  "ecr:BatchGetImage",
                  "ecr:GetDownloadUrlForLayer",
                  "ecr:BatchCheckLayerAvailability"
                ]
              }]
            }')

          aws ecr set-repository-policy \
            --repository-name luna \
            --policy-text "$policy_json" >/dev/null

          docker buildx build \
            --platform linux/amd64 \
            --provenance=false \
            --push \
            -t "$image_uri:$image_tag" \
            -t "$image_uri:latest" \
            -f Dockerfile \
            .

          image_digest=$(aws ecr describe-images \
            --repository-name luna \
            --image-ids imageTag="$image_tag" \
            --query 'imageDetails[0].imageDigest' \
            --output text \
            --no-cli-pager)

          {
            echo "### Luna production candidate"
            echo
            echo "- Image tag: \`${image_tag}\`"
            echo "- Image digest: \`${image_digest}\`"
            echo "- Promotion: run the production workflow manually"
          } >> "$GITHUB_STEP_SUMMARY"
