api:
  profile: api-public
  global:
    environment: production
    applicationName: luna
    team: operations
    costCenter: ""
  fullnameOverride: luna
  replicaCount: 1
  minReadySeconds: 10
  image:
    repository: "199420984430.dkr.ecr.us-east-1.amazonaws.com/luna"
    pullPolicy: IfNotPresent
    tag: "bootstrap"
    digest: ""
  serviceAccount:
    create: true
    name: luna
    automount: false
  service:
    type: ClusterIP
    port: 4111
  startupProbe:
    enabled: true
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 5
    periodSeconds: 5
    failureThreshold: 30
  livenessProbe:
    enabled: true
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 10
    periodSeconds: 10
    failureThreshold: 3
  readinessProbe:
    enabled: true
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 5
    periodSeconds: 10
    failureThreshold: 3
  ingress:
    enabled: false
    className: traefik
    hosts:
      - host: luna.buyticketbrasil.com
        paths:
          - path: /
            pathType: Prefix
  externalSecret:
    enabled: true
    secretKey: /aws/workloads-production/luna/secrets
  envFrom:
    - secretRef:
        name: luna
  env:
    - name: NODE_ENV
      value: production
    - name: HOST
      value: 0.0.0.0
    - name: PORT
      value: "4111"
  datadog:
    enabled: true
    env: production
    service: luna
    version: "bootstrap"
  lifecycle:
    enabled: true
    preStop:
      exec:
        command:
          - /bin/sh
          - -c
          - sleep 10
  scheduling:
    workloadClass: general
  nodeSelector:
    workload-class: general
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 2Gi
